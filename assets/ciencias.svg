<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Def for one single vertical spoke pointing straight up (reaching the crop edge y = 0) -->
    <g id="spoke">
      <line x1="200" y1="165" x2="200" y2="150" />
      <line x1="200" y1="135" x2="200" y2="120" />
      <line x1="200" y1="105" x2="200" y2="90" />
      <line x1="200" y1="75" x2="200" y2="60" />
      <line x1="200" y1="45" x2="200" y2="30" />
      <line x1="200" y1="15" x2="200" y2="0" />
    </g>
  </defs>
  
  <!-- Group of sharp spokes in fluorescent hot coral with a transparent background -->
  <g stroke="#ff5063" stroke-width="1.2" stroke-linecap="round" opacity="0.95">
    <!-- 16 rotated instances of the spoke def around center (200, 200) -->
    <use href="#spoke" transform="rotate(0 200 200)" />
    <use href="#spoke" transform="rotate(22.5 200 200)" />
    <use href="#spoke" transform="rotate(45 200 200)" />
    <use href="#spoke" transform="rotate(67.5 200 200)" />
    <use href="#spoke" transform="rotate(90 200 200)" />
    <use href="#spoke" transform="rotate(112.5 200 200)" />
    <use href="#spoke" transform="rotate(135 200 200)" />
    <use href="#spoke" transform="rotate(157.5 200 200)" />
    <use href="#spoke" transform="rotate(180 200 200)" />
    <use href="#spoke" transform="rotate(202.5 200 200)" />
    <use href="#spoke" transform="rotate(225 200 200)" />
    <use href="#spoke" transform="rotate(247.5 200 200)" />
    <use href="#spoke" transform="rotate(270 200 200)" />
    <use href="#spoke" transform="rotate(292.5 200 200)" />
    <use href="#spoke" transform="rotate(315 200 200)" />
    <use href="#spoke" transform="rotate(337.5 200 200)" />
    
    <!-- Central glowing dot (delicate 2.2 radius) -->
    <circle cx="200" cy="200" r="2.2" fill="#ff5063" stroke="none" />
  </g>
</svg>
